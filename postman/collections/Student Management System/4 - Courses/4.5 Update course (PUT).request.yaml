$kind: http-request
url: "{{baseUrl}}/api/courses/{{courseId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"title":"Data Structures and Algorithms","code":"DS{{runId}}","credits":4,"departmentId":{{departmentId}}}'
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
