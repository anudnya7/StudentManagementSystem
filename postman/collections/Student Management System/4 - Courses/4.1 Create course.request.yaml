$kind: http-request
description: Task 1. A course belongs to one department.
url: "{{baseUrl}}/api/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"title":"Data Structures","code":"DS{{runId}}","credits":4,"departmentId":{{departmentId}}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("courseId", pm.response.json().id);
    language: text/javascript
order: 1000
