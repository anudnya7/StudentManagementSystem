$kind: http-request
description: Filter by department.
url: "{{baseUrl}}/api/courses?departmentId={{departmentId}}"
method: GET
queryParams:
  departmentId: "{{departmentId}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
