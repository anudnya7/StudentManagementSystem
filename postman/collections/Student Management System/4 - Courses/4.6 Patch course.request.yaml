$kind: http-request
description: Change only credits.
url: "{{baseUrl}}/api/courses/{{courseId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"credits":3}'
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
