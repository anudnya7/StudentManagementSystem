$kind: http-request
description: "Task 1: many-to-many Student to Course. Allowed only because the course is in the student's department."
url: "{{baseUrl}}/api/students/{{studentId}}/courses/{{courseId}}"
method: POST
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
