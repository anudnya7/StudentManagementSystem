$kind: http-request
description: All five fields required.
url: "{{baseUrl}}/api/students/update/{{studentId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"firstName":"Rahul","lastName":"Sharma-Updated","email":"{{studentEmail}}","phone":"{{studentPhone}}","dateOfBirth":"2004-05-14"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("name updated", () => pm.expect(pm.response.json().lastName).to.eql("Sharma-Updated"));
    language: text/javascript
order: 11000
