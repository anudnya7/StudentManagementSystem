$kind: http-request
description: Only lastName changes.
url: "{{baseUrl}}/api/students/patch/{{studentId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"lastName":"Patel"}'
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 12000
