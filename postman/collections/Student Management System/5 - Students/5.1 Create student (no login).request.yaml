$kind: http-request
description: Creates a second student. Saves otherStudentId.
url: "{{baseUrl}}/api/students/create"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"firstName":"Priya","lastName":"Verma","email":"priya{{runId}}@college.edu","phone":"{{otherPhone}}","dateOfBirth":"2003-09-21"}'
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("otherPhone", "8" + Math.floor(100000000 + Math.random() * 900000000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("otherStudentId", pm.response.json().id);
    language: text/javascript
order: 1000
