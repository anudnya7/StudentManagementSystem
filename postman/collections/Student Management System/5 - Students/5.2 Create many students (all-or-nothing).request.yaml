$kind: http-request
description: A JSON array.
url: "{{baseUrl}}/api/students/createall"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '[{"firstName":"Amit","lastName":"Singh","email":"amit{{runId}}@college.edu","phone":"{{batchPhone1}}","dateOfBirth":"2002-01-10"},{"firstName":"Neha","lastName":"Gupta","email":"neha{{runId}}@college.edu","phone":"{{batchPhone2}}","dateOfBirth":"2002-07-30"}]'
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set("batchPhone1", "7" + Math.floor(100000000 + Math.random() * 900000000));
      pm.collectionVariables.set("batchPhone2", "6" + Math.floor(100000000 + Math.random() * 900000000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("two students created", () => pm.expect(pm.response.json().length).to.eql(2));
    language: text/javascript
order: 2000
