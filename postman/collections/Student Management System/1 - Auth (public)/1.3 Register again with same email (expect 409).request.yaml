$kind: http-request
description: Duplicate email is rejected.
url: "{{baseUrl}}/api/auth/register"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: data
      value: '{"firstName":"Rahul","lastName":"Sharma","email":"{{studentEmail}}","phone":"{{studentPhone}}","dateOfBirth":"2004-05-14","password":"{{studentPassword}}"}'
      contentType: application/json
    - type: file
      key: photo
      src: []
      description: Optional. Tick this row and click Select Files to choose a .jpg or .png (max 2MB).
      disabled: true
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 3000
