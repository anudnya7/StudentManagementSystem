$kind: http-request
description: All fields required. Also clears the courses/students caches because the department name appears in them.
url: "{{baseUrl}}/api/departments/{{departmentId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"name":"Computer Science {{runId}} Updated","code":"CS{{runId}}"}'
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
