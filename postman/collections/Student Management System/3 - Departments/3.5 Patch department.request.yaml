$kind: http-request
description: Send only the fields to change.
url: "{{baseUrl}}/api/departments/{{departmentId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"name":"Computer Science {{runId}}"}'
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
