$kind: http-request
description: multipart/form-data, part 'file'. Click Select Files and choose a real .jpg or .png (max 2MB).
url: "{{baseUrl}}/api/profile/photo"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
