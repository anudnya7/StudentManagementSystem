# ---------- production ----------
# no defaults for secrets: the app refuses to start if one is missing
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.actuator.password=${ACTUATOR_PASSWORD}
app.admin.password=${ADMIN_PASSWORD}

# schema must exist already (use Flyway or Liquibase for changes); Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate

logging.level.root=INFO
logging.level.org.example.studentmanagementsystem=INFO

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never