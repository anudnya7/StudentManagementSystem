spring.application.name=StudentManagementSystem

# dev is the default. For production run with SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# ---------- Database (secrets come from environment variables) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_management_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ---------- JPA / Hibernate ----------
# services are @Transactional, so lazy loading in the view layer is not needed
spring.jpa.open-in-view=false
# loads lazy department/courses for a whole page in a few queries instead of 1 query per student (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- Server ----------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true

# ---------- Logging (levels are set per profile) ----------
logging.pattern.level=%5p [%X{requestId}]
logging.file.name=logs/student-app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

# ---------- JWT ----------
app.jwt.expiration-ms=3600000

# ---------- File upload ----------
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ---------- Redis cache ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
# fail fast (2s) if Redis is down instead of hanging a request
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
# Redis is used only as a cache, not as a repository store
spring.data.redis.repositories.enabled=false
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.key-prefix=sms:
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# readiness only depends on the database: the app still works (slower) when Redis is down
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.roles=ACTUATOR
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
info.app.name=Student Management System
info.app.description=Students, departments, courses, JWT login, photo upload, Redis caching
# username/password for every actuator endpoint except /actuator/health and /actuator/info
app.actuator.username=${ACTUATOR_USER:actuator}
