# ---------- local development ----------
spring.datasource.password=${DB_PASSWORD:anudnya}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# all five log levels for our own code, SQL from Hibernate
logging.level.root=INFO
logging.level.org.example.studentmanagementsystem=TRACE
logging.level.org.hibernate.SQL=DEBUG

# at least 32 characters (HS256 needs a 256-bit key)
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value-123456}
app.actuator.password=${ACTUATOR_PASSWORD:actuator123}
# password of the seeded admin (dev only default)
app.admin.password=${ADMIN_PASSWORD:admin123}

# more endpoints for learning (they need the actuator user, see app.actuator.*)
management.endpoints.web.exposure.include=health,info,metrics,loggers,caches,env
management.endpoint.health.show-details=when-authorized